[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomicswapd"
version = "0.1.0"
description = "Headless market maker for BTC <-> MARS atomic swaps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atomicswapd = "atomicswapd.__main__:main"

[tool.setuptools.packages.find]
include = ["atomicswapd*"]

[tool.setuptools.package-data]
atomicswapd = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
