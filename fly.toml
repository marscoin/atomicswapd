# One machine only: the hot wallet and swap database live on its volume,
# and two makers sharing one wallet would double-post offers.
app = "marscoin-swaps"
primary_region = "lax"
kill_signal = "SIGINT"
kill_timeout = 30

[env]
  ATOMICSWAPD_DATA = "/data"
  ATOMICSWAPD_MODE = "watch"

[mounts]
  source = "maker_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
